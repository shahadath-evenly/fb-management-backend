# Self-contained backend stack: the API plus its own PostgreSQL —
# nothing here depends on the frontend repo in any way. Run entirely
# from this directory: `docker compose up -d` / `docker compose down`.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fnb_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
      POSTGRES_DB: ${POSTGRES_DB:-fnb_management}
    volumes:
      - backend_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fnb_user} -d ${POSTGRES_DB:-fnb_management}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5001
      DATABASE_URL: "postgresql://${POSTGRES_USER:-fnb_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fnb_management}?schema=public"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in backend/.env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-14d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@admin.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in backend/.env}
    ports:
      - "${BACKEND_PORT:-5001}:5001"

volumes:
  backend_db_data:
